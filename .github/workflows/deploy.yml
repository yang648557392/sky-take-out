name: Deploy Sky Take-Out

on:
  workflow_run:
    workflows:
      - Sky Take-Out CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf "%s\n" "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on AWS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "
              set -e
              cd /home/ubuntu/apps/sky-take-out
              git pull --ff-only origin main
              sudo env IMAGE_TAG='$IMAGE_TAG' docker compose pull backend frontend
              sudo env IMAGE_TAG='$IMAGE_TAG' docker compose up -d --no-build backend frontend
            "

      - name: Verify public website
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            https://skytakeout.yangmingzhe.com/ \
            > /dev/null
