name: sky-take-out

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sky_take_out
      MYSQL_USER: skyapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/sql/sky.sql:/docker-entrypoint-initdb.d/01-sky.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m

      SKY_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SKY_DATASOURCE_HOST: mysql
      SKY_DATASOURCE_PORT: 3306
      SKY_DATASOURCE_DATABASE: sky_take_out
      SKY_DATASOURCE_USERNAME: skyapp
      SKY_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SKY_REDIS_HOST: redis
      SKY_REDIS_PORT: 6379
      SKY_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SKY_REDIS_DATABASE: 10

      SKY_JWT_ADMIN_SECRET_KEY: ${JWT_ADMIN_SECRET}
      SKY_JWT_USER_SECRET_KEY: ${JWT_USER_SECRET}

      SKY_ALIOSS_ENDPOINT: disabled
      SKY_ALIOSS_ACCESS_KEY_ID: disabled
      SKY_ALIOSS_ACCESS_KEY_SECRET: disabled
      SKY_ALIOSS_BUCKET_NAME: disabled

      SKY_WECHAT_APPID: disabled
      SKY_WECHAT_SECRET: disabled
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VUE_APP_SOCKET_URL: wss://skytakeout.yangmingzhe.com/ws/
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge
